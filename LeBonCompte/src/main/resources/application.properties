spring.application.name=LeBonCompte

spring.datasource.url=jdbc:postgresql://localhost:5432/leboncompte
spring.datasource.username=leboncompte
spring.datasource.password=leboncompte

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# First admin, created on startup only when there is no user yet. Blank password = a random one, printed in the log.
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD:}
# Signs the remember-me cookie (which also embeds the user's password hash). Set your own in prod.
app.remember-me.key=${APP_REMEMBER_ME_KEY:leboncompte-remember-me}
