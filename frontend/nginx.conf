# Front and API on the same origin, so the session cookie and XSRF-TOKEN just work.
server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Angular routes (/dashboard, /login...) all load index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached, or a deploy isn't picked up; hashed bundles can be.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
